# Material profiles.
#
# chipload values are mm/tooth, keyed by tool id from tools.yaml.
# doc_fraction is the recommended depth-of-cut per pass as a fraction of
# tool diameter (e.g. 0.5 with a 6mm tool means 3mm per pass).
#
# Feed rate is derived as: feed = chipload * flutes * rpm
# DOC is derived as:       doc  = doc_fraction * tool.diameter_mm
#
# These are starting points, not gospel. Measure chips, listen, adjust.

- id: plywood_baltic_birch_3mm
  family: wood
  thickness_mm: 3.0
  chipload:
    flat_3.175mm_2flute: 0.04
    flat_6mm_2flute: 0.08
  doc_fraction: 0.5
  doc_fraction_finish: 0.25

- id: plywood_baltic_birch_6mm
  family: wood
  thickness_mm: 6.0
  chipload:
    flat_3.175mm_2flute: 0.04
    flat_6mm_2flute: 0.08
  doc_fraction: 0.5
  doc_fraction_finish: 0.25

- id: mdf_12mm
  family: wood
  thickness_mm: 12.0
  chipload:
    flat_3.175mm_2flute: 0.05
    flat_6mm_2flute: 0.10
  doc_fraction: 1.0

- id: aluminum_6061_3mm
  family: aluminum
  thickness_mm: 3.0
  chipload:
    flat_3.175mm_2flute: 0.015
    flat_6mm_2flute: 0.025
  doc_fraction: 0.15
  doc_fraction_finish: 0.05
  notes: |
    Conservative starting numbers. On a 500W spindle, aluminum is doable
    but unforgiving — use sharp tools, climb mill, and consider trochoidal
    clearing once you've graduated past the basics.

- id: acrylic_3mm
  family: acrylic
  thickness_mm: 3.0
  chipload:
    flat_3.175mm_2flute: 0.06
    flat_2mm_2flute: 0.04
  doc_fraction: 0.4
  doc_fraction_finish: 0.2
  notes: |
    Cast acrylic (PMMA), 3mm. The enemy is MELTING, not force: keep RPM as
    low as the spindle allows (Anolex floor ~8000) and feed fast enough to
    make real chips, not dust. Single-flute ("O-flute") bits are ideal (less
    recutting); a 2-flute works at low RPM + high feed. Climb mill; clear
    chips before they re-weld. If the edge gums: lower RPM (floor 8000), then
    raise feed / lower DOC. Peck plunges help holes.

- id: petg_3mm
  family: petg
  thickness_mm: 3.0
  chipload:
    flat_3.175mm_2flute: 0.06
    flat_2mm_2flute: 0.04
  doc_fraction: 0.35
  doc_fraction_finish: 0.2
  notes: |
    PET / PETG sheet ("PET plexiglass"), 3mm. Tougher than acrylic (cracks
    less) but GUMMIER — more prone to melting, stringing, and re-welding
    chips. Same melt-avoidance recipe as acrylic but harder: run RPM at the
    floor (~8000), feed fast, keep DOC shallow, climb mill, and clear chips
    aggressively (air blast / dust shoe). A single-flute bit helps a lot.
    These numbers are a STARTING point — test on scrap first. NOTE: measure
    your sheet's real thickness; "3mm" plastic is often 2.0–2.8mm.

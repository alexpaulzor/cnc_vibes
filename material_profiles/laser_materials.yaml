# Laser materials profile — SHARED across the vibes monorepo.
#
# Single source of truth for per-material diode-laser cut parameters, read by
# every sub-project via a relative path to this file:
#   jigsawzall/emitter.py, orpot/emit.py, orpot/svg2laser.py,
#   cnc_vibes/scripts/{cam_cli,laser_cam}.py, cnc_vibes/lessons/laser/*.
# Edit here once and all of them pick it up.
#
# Machine assumptions: a ~10W optical-power diode laser (e.g. LaserTree 10W)
# through a GRBL controller in laser mode ($32=1). All cuts use STATIC M3
# constant power (this weak diode under-fires on M4 dynamic mode) at 100%
# power, with a 1s out-and-back warmup lead-in to cover the cold-start ramp.
# Feeds were calibrated with the concentric warmup ring test
# (jigsaw.py warmup-test / cnc.py cal-laser).
#
# Values are PUBLISHED STARTING POINTS. They are not calibrated for your
# specific machine, lens condition, bed height, or current air-assist
# pressure. Refine them empirically (jigsaw.py warmup-test / cnc.py cal-laser)
# and always cut a small test before committing to a real part.
#
# Schema per entry:
#   id                 stable string id (referenced from job specs / --material)
#   family             "wood" | "acrylic" | "paper" | ...
#   thickness_mm       material thickness in mm
#   laser:
#     power_percent    S value as percent of 1000 (so 100 -> S1000)
#     feed_mm_per_min  cut feedrate at static M3 100% power; the dominant
#                      cut-through control (slower = deeper)
#     passes           cut-through passes (1 = single pass; more = deeper)
#     notes            free-form safety / quality / technique notes
#   fit (optional):    measured fit data for slot/tab and hole work:
#     kerf_mm          kerf to compensate (kept wood grows kerf/2 per edge,
#                      holes shrink kerf/2)
#     slot_extra_mm    extra slot width over thickness_mm for a tab fit
#                      (0 = slot drawn exactly at thickness_mm)
#     verified         what was cut and how it fit
#   etch (optional):   a SHALLOW, non-cutting score pass (e.g. an orientation
#                      mark or decorative line design) -- much lower power
#                      and/or higher feed than `laser`, same static-M3 /
#                      single-pass conventions. Verify on a fresh material
#                      with scripts/etch_calibration.py (a self-labeled
#                      power x feed grid) before trusting an entry's
#                      numbers on a real part -- birch3's
#                      is calibrated this way; any other material's etch:
#                      block is still an unverified starting guess until
#                      it gets the same treatment (jigsawzall/RING_SPEC.md).

- id: birch3
  family: wood
  thickness_mm: 3.0
  min_feature_mm: 4.0   # flimsier than the 3-ply veneer; the old 4mm floors
  laser:
    power_percent: 100
    feed_mm_per_min: 500
    passes: 1
    notes: |
      Reliable workhorse. Air assist strongly recommended.
      500mm/min SINGLE pass. 600 was calibrated as always-clean on the concentric
      warmup ring test (581mm/min severed with faint edge char), but in practice
      600 runs too hot/fast for clean single-pass severing on real cuts, so the
      default is 500 for margin. Static M3 at 100% with the 1s out-and-back warmup
      lead-in handles the cold-start zone. Springier than MDF — may flex/curl more
      readily. Drop feed or add a pass only for stubborn/thicker stock.
  etch:
    power_percent: 25
    feed_mm_per_min: 2500
    passes: 1
    notes: |
      CALIBRATED on a real scrap test (scripts/etch_calibration.py, a 5
      power x 4 feed grid self-labeled on the wood). 25%/2500mm/min was
      picked by inspection as the sweet spot: clearly visible medium-brown
      contrast, no smoke, not approaching cut depth. 30% showed diminishing
      returns over 25% (not meaningfully darker, just more energy spent),
      10-15% too faint to rely on once painted over. Every etch stroke gets
      its own warmup wiggle, scaled linearly from the 1s full-power ramp
      (jigsawzall/emitter.py WARMUP_MS) by this profile's power_percent --
      at 25% that's a ~250ms / ~2mm lead-in, not the full 1s/8.3mm a 100%
      cut needs.

- id: ply3
  family: wood
  thickness_mm: 2.63   # measured by Alex; sold as 3mm (id kept for existing references)
  min_feature_mm: 3.0   # thinnest wood that survives (stiff cross-grain 3-ply); jigsawzall derives its floors from it
  laser:
    power_percent: 100
    feed_mm_per_min: 350
    passes: 1
    notes: |
      Stiffer 3-ply cross-grain veneered stock (the stock the relaxed
      tab/bend/clearance floors in jigsawzall/geometry.py are tuned for).
      350mm/min SINGLE pass at static M3 100%, confirmed in use by Alex
      ("1 pass works well at 350"). Same 1s out-and-back warmup lead-in as
      every other cut (5.8mm at F350).
  etch:
    power_percent: 100
    feed_mm_per_min: 5000
    passes: 1
    mode: static       # M3. M4 (dynamic) did not fire at all on this controller (Grbl_ESP32 1.3a)
    # no lead_in_mm: linear warmup model (700ms at 70% = 58.3mm at F5000), spread by
    # loop follow-through / open-stroke ping-pong instead of a pile-up at the start
    notes: |
      CALIBRATED with cnc_calibrate/etch_matrix_cal.py v4 (single-pass sectors,
      real letter outlines per cell): Alex picked 70% / F5000, M3, then moved to 100% / F5000 after a real cut:
      70% read light in spots; 100%'s darker, wider lines give better contrast. On the plate
      F3200 lines read heavier/wider than F5000 at every power, 100% scorched a
      halo, 25%/F5000 went dashed on long arcs.
      Earlier failures: 30%/F2500 too faint on a real cut; 100%/F5000 with raw
      0.1mm segments + 83mm warmup stalled and burned through -- fixed by
      0.05mm simplify + 0.3mm min segment + 3mm fixed lead-in (emit_etch_gcode).

- id: birch6
  family: wood
  thickness_mm: 6.0
  laser:
    power_percent: 100
    feed_mm_per_min: 200
    passes: 4
    notes: |
      Pushing the 10W diode's depth limit. Watch for charred edges.
      If cuts aren't going through, slow feed before adding passes.

- id: bamboo3
  family: wood
  thickness_mm: 3.0
  laser:
    power_percent: 100
    feed_mm_per_min: 350
    passes: 2
    notes: |
      Density varies layer-to-layer more than baltic birch.
      Expect occasional uncut spots; second pass usually finishes them.

- id: mdf3
  family: wood
  thickness_mm: 2.82  # NEW SUPPLIER batch (2026-11-04), measured 2.82 by Alex; much better quality than mdf3old
  fit:
    kerf_mm: 0.10
    slot_extra_mm: 0.0
    verified: |
      NOT YET for this batch. Kerf 0.10 and slot = thickness are carried over
      from mdf3old (verified there). Cut a tab-fit coupon in the new stock
      and update this block.
  laser:
    power_percent: 100
    feed_mm_per_min: 700
    passes: 3
    notes: |
      2026-11-04: F500 x2 (carried over from mdf3old) scorched badly on this
      batch, and every cut needed knife cleanup after the parts were punched out.
      Now 3 lighter passes: less heat per pass, and about 7% more total dwell
      (3/700 = 0.00429 vs 2/500 = 0.00400 min per mm) so it severs fully.
      UNVERIFIED: cut the fit coupon first. Still scorched: try F800 x3. Still
      needs the knife: try F600 x3. Smoke is heavy; air assist mandatory.

- id: mdf3old
  family: wood
  thickness_mm: 3.1   # previous supplier, sold as 1/8"; measured 3.10 pressed firmly in the calipers, up to ~3.2 relaxed / humid
  fit:
    kerf_mm: 0.10
    slot_extra_mm: 0.0
    verified: |
      2026-11-03, marbles wheel box (scads marbles/clock/wheel_box_gcode.py):
      10 mm tabs into slots drawn at exactly 3.1 mm, kerf-compensated with
      0.10 mm, cut at 100% F500 x2. Tabs fit tight and snug with no
      deforming. Use these values for slot/tab work in THIS (old) stock.
  laser:
    power_percent: 100
    feed_mm_per_min: 500
    passes: 2
    notes: |
      Primary orpot stock. Denser than plywood. Smoke is heavy — air assist
      mandatory. Edges char darker than plywood; sand/wipe before finishing.
      500mm/min x2 passes severs 3mm cleanly (validated on orpot parts). For a
      long thin part (e.g. the orpot spiral ribbon) keep it tabbed to the sheet
      or support it so it doesn't shift on the second pass.

- id: mdf6
  family: wood
  thickness_mm: 6.35   # sold as 1/4"; NOT measured yet
  laser:
    power_percent: 100
    feed_mm_per_min: 250
    passes: 4
    notes: |
      UNVERIFIED STARTING GUESS (2026-11-04), not cut yet. mdf3 severs at
      F500 x2 here; this doubles the passes at half that feed for twice the
      depth. That's a guess, not a calibration, and may be past what the diode
      can cut cleanly (heavy char, wide kerf). Measure the thickness, then run
      the warmup ring test (cnc.py cal-laser) before cutting a real part.

- id: balsa3
  family: wood
  thickness_mm: 3.0
  laser:
    power_percent: 80
    feed_mm_per_min: 800
    passes: 1
    notes: |
      Very soft. Cuts fast and clean. Watch for fire — low density
      means flames can take hold. Air assist mandatory.

- id: acrylic3clear
  family: acrylic
  thickness_mm: 3.0
  laser:
    power_percent: 100
    feed_mm_per_min: 150
    passes: 3
    notes: |
      Diode lasers struggle with CLEAR acrylic — much of the IR passes
      through without absorption. Mitigate by masking the top with paper
      masking tape or painting it (any color). Cast (not extruded);
      extruded acrylic gums up and burns instead of cutting cleanly.

- id: acrylic3color
  family: acrylic
  thickness_mm: 3.0
  laser:
    power_percent: 100
    feed_mm_per_min: 250
    passes: 2
    notes: |
      Colored cast acrylic absorbs the diode's wavelength much better
      than clear. Cuts cleanly with polished edges. Cast only.
      ALEX, 2026-11-04: FAILED on his translucent coloured acrylic on the AnoleX
      diode (the vendor only claims black works). Treat this recipe as unproven;
      route clear/coloured acrylic on the CNC spindle instead.

- id: acrylic3
  family: acrylic
  thickness_mm: 3.0   # black cast acrylic, sold as 3 mm; NOT measured yet
  fit:
    kerf_mm: 0.15
    slot_extra_mm: 0.0
    verified: |
      NOT YET. 0.15 is a guess (acrylic melts back a little wider than wood's 0.10). Measure a cut square.
  laser:
    power_percent: 100
    feed_mm_per_min: 150
    passes: 2
    notes: |
      BLACK cast acrylic only (the diode's light passes through clear and most colours: Alex's
      translucent coloured sheet failed, 2026-11-04). Best diode-laser acrylic; edges should come out
      glossy.
      2026-11-09: UNTESTED BEST GUESS for the 10 W diode, raised from F300 x2 (never tried) to
      F150 x2: twice the time on each mm, since 3 mm acrylic is usually quoted near the limit of
      a 10 W diode. Air assist ON (it also keeps the melt from re-welding the kerf). Ventilate:
      acrylic fumes are irritating. If it severs with margin, try F200 x2; if it re-welds or
      leaves a skin at the bottom, F120 x2 or a third pass. Extruded acrylic gums up: cast only.
- id: card2
  family: paper
  thickness_mm: 2.0
  laser:
    power_percent: 60
    feed_mm_per_min: 1500
    passes: 1
    notes: |
      Single-wall corrugated. FIRE RISK — air assist non-negotiable;
      do not dwell. Cuts at very low power; bump only if not through.

- id: corrugated3
  family: paper
  thickness_mm: 3.0
  laser:
    power_percent: 100
    feed_mm_per_min: 1200
    passes: 1
    notes: |
      Single-wall corrugated, ~3mm. FIRE RISK — air assist
      non-negotiable; never dwell over a stationary spot. The
      air gap inside the flutes means a single fast pass at 100%
      usually cuts through; if the bottom liner survives, add a
      second pass rather than slowing the feed (dwelling chars +
      flares the kerf). Good cheap stock for puzzle-fit tolerance
      tests and first spiral flex-test / fit mockups. Verify
      dwell/min-power with cnc.py cal-laser before a real cut.

- id: cardstock03
  family: paper
  thickness_mm: 0.3
  laser:
    power_percent: 30
    feed_mm_per_min: 3000
    passes: 1
    notes: |
      Watch for ignition. Air assist mandatory. Useful for stencils
      and quick calibration tests.

- id: card1
  family: paper
  thickness_mm: 1.0
  laser:
    power_percent: 50
    feed_mm_per_min: 2500
    passes: 1
    notes: |
      Thin non-corrugated cardboard (cereal box, shoebox panel). FIRE
      RISK is real — air assist non-negotiable; do not dwell over a
      single spot. Single fast pass at medium power. If charring is
      excessive, drop power 10% before adding passes. Good cheap
      stock for puzzle-fit tolerance tests and machine-tram checks.

# NEVER cut these with a laser — release toxic gases:
#   - PVC (any color, any thickness): chlorine gas + corrodes machine
#   - Polycarbonate / Lexan: burns, fumes, doesn't cut cleanly
#   - ABS: cyanide gas
#   - Vinyl: chlorine gas
#   - Galvanized metal: zinc fumes
#   - Anything containing chromium, copper, or unknown composition
